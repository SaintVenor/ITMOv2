<!doctype html>
<html lang="ru">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Орбита · интерактивный макет</title>
  <style>
    :root {
      color-scheme: light;
      --mantine-font-family: Inter, "Segoe UI", system-ui, sans-serif;
      --mantine-font-family-headings: "PT Serif", Georgia, serif;
      --paper: #f3f3ef;
      --surface: #ffffff;
      --panel-alt: #e9edeb;
      --line: #c6ccc7;
      --ink: #192122;
      --muted: #54615f;
      --pine: #354f46;
      --selected: #21342c;
      --selected-ink: #ffffff;
      --copper: #69408b;
      --event: #293b78;
      --event-bg: #e6e9fc;
      --event-mark: #5065ac;
      --deadline: #843c2c;
      --deadline-bg: #f8e0d9;
      --deadline-mark: #ac5943;
      --birthday: #713963;
      --birthday-bg: #f3e1f0;
      --birthday-mark: #a25992;
      --step: #15556a;
      --step-bg: #daf0f4;
      --step-mark: #28788b;
      --lesson: #243d32;
      --lesson-bg: #e1e9e5;
      --mantine-color-body: #f3f3ef;
      --mantine-color-text: #192122;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #161c1c;
      --surface: #202928;
      --panel-alt: #29332e;
      --line: #485451;
      --ink: #f6f1e7;
      --muted: #b2c0ba;
      --pine: #c0decc;
      --selected: #c8ddd1;
      --selected-ink: #21342c;
      --copper: #dec3fa;
      --event: #dce1ff;
      --event-bg: #2e3d70;
      --event-mark: #9baaf2;
      --deadline: #ffe1d6;
      --deadline-bg: #624237;
      --deadline-mark: #e5a590;
      --birthday: #ffe0f6;
      --birthday-bg: #55334f;
      --birthday-mark: #e7a0d5;
      --step: #d8fbff;
      --step-bg: #274939;
      --step-mark: #8bd6e2;
      --lesson: #d4eadc;
      --lesson-bg: #303f3a;
      --mantine-color-body: #161c1c;
      --mantine-color-text: #f6f1e7;
    }
    body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.55 var(--mantine-font-family); }
    button, select, input, textarea { font:inherit; color:inherit; }
    button, select { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:7px 12px; font-size:14px; }
    button { cursor:pointer; font-weight:600; }
    button:hover { background:var(--panel-alt); }
    button:disabled { cursor:default; opacity:.48; }
    button.primary { background:var(--selected); color:var(--selected-ink); }
    button.light { background:var(--panel-alt); color:var(--pine); border-color:transparent; }
    button.link, button.cardLink, button.brand, .header nav button, .theme-toggle, .subtle, .danger { border:0; background:transparent; color:inherit; }
    button.link { color:var(--pine); text-decoration:underline; padding:0; font:inherit; }
    button.danger { color:#b22d2d; }
    [data-theme="dark"] button.danger { color:#ffa3a3; }
    [hidden] { display:none !important; }
    .muted { color:var(--muted); }
    .review { border-top:1px solid var(--line); padding:12px 0; font-size:13px; color:var(--muted); }
    .review summary { cursor:pointer; width:fit-content; }
    .review-buttons, .entry-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .review-buttons button { font-size:12px; }
    dialog { width:min(440px,calc(100% - 24px)); border:1px solid var(--line); border-radius:16px; color:var(--ink); background:var(--surface); padding:18px; }
    dialog::backdrop { background:#0006; }
    .dialog-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .dialog-top h2 { font-size:22px; margin:0; }
    form, form label, .pick-group { display:grid; gap:6px; }
    form, .pick-group { gap:12px; }
    form input, form select, form textarea { width:100%; border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:8px 10px; }
    form button.primary { justify-self:end; }
    .dates { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .error,.clash { background:var(--deadline-bg); color:var(--deadline); padding:8px 12px; }

* { box-sizing: border-box; }
body { min-width: 0; }
a { color: var(--pine); }
:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--pine);
  outline-offset: 3px;
}
h1, h2, h3 { font-family: var(--mantine-font-family-headings); font-weight: 400; }
.shell { max-width: 1320px; margin-inline: auto; padding-inline: 28px; }
.content { padding-block: 24px 40px; }
.header { border-bottom: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.header-inner { min-height: 62px; display: flex; gap: 24px; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); font: 680 25px var(--mantine-font-family); letter-spacing: -.055em; text-decoration: none; white-space: nowrap; }
.brand-mark { position: relative; width: 27px; height: 27px; border: 1px solid var(--pine); border-radius: 50%; }
.brand-mark::before { content: ''; position: absolute; inset: 7px -5px; border: 1px solid var(--pine); border-radius: 50%; transform: rotate(-34deg); }
.brand-mark::after { content: ''; position: absolute; width: 7px; height: 7px; top: 2px; right: 0; border-radius: 50%; background: var(--pine); }
.header nav { display: flex; gap: 9px; }
.header nav button { color: var(--ink); text-decoration: none; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: 550; }
.header nav button[aria-current="page"] { background: var(--panel-alt); color: var(--ink); }
.header-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.header .theme-toggle { color: var(--ink); font-size: 22px; }
.header-add { --button-bg: var(--selected) !important; --button-hover: var(--pine) !important; --button-color: var(--selected-ink) !important; }
.header :focus-visible { outline-color: var(--pine); }
.kind-event { --kind-text: var(--event); --kind-bg: var(--event-bg); --kind-mark: var(--event-mark); }
.kind-deadline { --kind-text: var(--deadline); --kind-bg: var(--deadline-bg); --kind-mark: var(--deadline-mark); }
.kind-birthday { --kind-text: var(--birthday); --kind-bg: var(--birthday-bg); --kind-mark: var(--birthday-mark); }
.kind-step { --kind-text: var(--step); --kind-bg: var(--step-bg); --kind-mark: var(--step-mark); }
@media (max-width: 700px) {
  .shell { padding-inline: 12px; }
  .content { padding-block: 16px 24px; }
  .header-inner { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; padding-block: 7px; }
  .brand { font-size: 22px; }
  .brand-mark { width: 22px; height: 22px; }
  .brand-mark::before { inset: 6px -4px; }
  .header nav { grid-row: 2; grid-column: 1 / -1; gap: 4px; }
  .header nav button { padding: 5px 8px; font-size: 13px; }
  .header-actions { grid-row: 1; grid-column: 2; }
  .header-add { padding-inline: 8px; font-size: 12px; min-height: 32px; }
}

@media (max-width:700px) {
  .header-inner:not(:has(.header-add:not([hidden]))) {display:flex;min-height:48px}
  .header-inner:not(:has(.header-add:not([hidden]))) nav {margin-inline:auto}
}

[data-lesson] { --lesson-hue: 230; }
[data-lesson="lecture"] { --lesson-hue: 247; }
[data-lesson="practice"] { --lesson-hue: 173; }
[data-lesson="lab"] { --lesson-hue: 304; }
[data-lesson="consultation"] { --lesson-hue: 40; }
[data-lesson] {
  --lesson-bg: hsl(var(--lesson-hue) 45% 94%);
  --lesson: hsl(var(--lesson-hue) 42% 34%);
  --lesson-mark: hsl(var(--lesson-hue) 44% 48%);
}
[data-theme="dark"] [data-lesson] {
  --lesson-bg: hsl(var(--lesson-hue) 24% 27%);
  --lesson: hsl(var(--lesson-hue) 70% 84%);
  --lesson-mark: hsl(var(--lesson-hue) 52% 72%);
}

.cal-heading {
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:'controls title views';align-items:center;gap:14px;
  padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink)
}
.cal-heading .controls { grid-area: controls; }
.cal-heading .calendarTitle { grid-area: title; }
.cal-heading > :last-child { grid-area: views; align-self: center; }
.calendarTitle { min-width: 0; margin-inline-end: auto; }
.cal-heading .calendarTitle[data-week-title] h1 { text-transform: none; }
.layout[data-week] { grid-template-columns: minmax(0, 1fr); }
.cal-heading h1 {
  font: 700 clamp(28px, 3vw, 42px) var(--mantine-font-family); letter-spacing: -.055em;
  line-height: 1.07;
  margin: 0;
  text-transform: capitalize;
}
.cal-heading .dayTitle { text-transform: none; }
.cal-heading h1 span {
  color: var(--muted);
  font: 500 18px var(--mantine-font-family);
  margin-left: 8px;
}
.summary { color: var(--muted); margin: 6px 0 0; min-height: 1.55em; }
.controls, .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters { padding-block: 14px; }
.filterToggle { display:none; }
.filterFields {display:flex;flex-wrap:wrap;gap:8px}
.filters select { background-color: var(--surface); }
.scheduleControls { display:grid; grid-template-columns:max-content 112px; gap:8px; align-items:center; min-height:30px; margin-inline-start:auto; }
.lessonAction { min-width:0; }
.lessonAction button { width:100%; padding-inline:5px; font-size:13px; }
.layout {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(250px, 3fr);
  align-items: start;
  gap: 20px;
}
.calendar, .agenda {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.calendar { overflow: hidden; }
.weekdays, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekdays { font-weight: 650; letter-spacing: .08em; text-transform: uppercase; background: var(--panel-alt); color: var(--muted); font-size: 13px; }
.weekdays span { padding: 8px 11px; }
.week {
  grid-template-rows: 34px repeat(3, 17px) 15px var(--lesson-row, 1px);
  isolation: isolate;
}
.day {
  display: grid;
  justify-items: start;
  align-items: start;
  grid-row: 1 / -1;
  padding: 4px;
  border: 0;
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.day:hover { background: var(--panel-alt); }
.day[aria-pressed="true"] { background: color-mix(in srgb, var(--selected) 9%, var(--surface)); }
.day:nth-child(7) { border-right: 0; }
.day.other { background: var(--paper); color: var(--muted); }
.day:focus-visible { outline-offset: -3px; z-index: 1; }
.day span {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font: 600 14px var(--mantine-font-family);
}
.day[aria-current] span { border: 1px solid var(--pine); }
.day[aria-pressed="true"] span { background: var(--selected); color: var(--selected-ink); }
.event {
  z-index: 2;
  border: 0;
  border-radius: 5px;
  margin: 1px 3px 0;
  padding: 0 5px;
  min-width: 0;
  background: var(--kind-bg);
  color: var(--kind-text);
  cursor: pointer;
  text-align: left;
  font: 500 11px var(--mantine-font-family);
}
.event-label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event[data-continuation-start] { border-left: 3px solid var(--kind-mark); }
.event[data-continuation-end] { border-right: 3px solid var(--kind-mark); }
.more {
  grid-row: 5;
  z-index: 2;
  border: 0;
  background: transparent;
  color: var(--pine);
  font: 600 11px var(--mantine-font-family);
  padding: 0 5px;
  text-align: left;
  cursor: pointer;
}
.week[data-lesson-overflow] { --lesson-row: 23px; }
.week[data-lesson-overflow] .lesson-count { grid-row: 6; }
.lesson-count {
  grid-row: 5;
  z-index: 2;
  align-self: center;
  justify-self: start;
  margin: 0 3px;
  padding: 0 5px;
  border: 0;
  border-radius: 5px;
  max-width: calc(100% - 6px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--lesson-bg);
  color: var(--lesson);
  font: 650 11px var(--mantine-font-family);
  cursor: pointer;
}
.agenda { padding: 18px; min-width: 0; border-radius: 4px; }
.agendaHead { margin: -18px -18px 16px; padding: 17px 18px; background: var(--panel-alt); color: var(--ink); }
.agendaHead .agendaLabel { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .13em; font-weight: 700; margin: 0 0 4px; }
.agenda h2 { font-size: 36px; letter-spacing: -.045em; line-height: 1.14; margin: 0; }
.agenda h2:focus-visible { outline: 2px solid var(--pine); outline-offset: 3px; }
.agendaLabel { color: var(--muted); margin: 4px 0 14px; }
.agendaEntry {
  border-left: 3px solid var(--kind-mark);
  border-radius: 8px;
  background: var(--paper);
  padding: 10px 12px;
  margin-bottom: 9px;
  overflow-wrap: anywhere;
}
.entryKind { color: var(--kind-text); font-size: 13px; }
.agendaEntry h3 { margin: 2px 0; font: 650 15px var(--mantine-font-family); }
.schedule { font-size: 14px; }
.lessons { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
.lessons > h3 { margin: 0 0 8px; font-size: 20px; }
.lessonEntry { background: var(--lesson-bg); color: var(--lesson); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; overflow-wrap: anywhere; }
.lessonEntry h4 { margin: 0 0 2px; font-size: 15px; }
.agendaActions { display: grid; gap: 8px; margin-top: 12px; }
.stepActions { display: grid; justify-items: start; gap: 8px; margin-top: 8px; font-size: 14px; }
.alert { margin: 0 0 12px; }
.form { display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.formActions { display: flex; justify-content: end; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
@media (max-width: 700px) {
  .cal-heading {grid-template-columns:1fr auto;grid-template-areas:'title title' 'controls views';gap:8px 4px;padding:4px 0 8px}
  .filterToggle {display:inline-flex}
  .filterFields:not([data-open]) {display:none}
  .filterFields {order:3;width:100%}
  .filters {padding-block:8px}

  .cal-heading .controls { gap: 4px; }
  .cal-heading h1 { font-size: 30px; }
  .cal-heading h1 span { font-size: 17px; }
  .summary { font-size: 13px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .weekdays span { text-align: center; padding: 4px 2px; }
  .week { grid-template-rows: 29px repeat(3, 5px) 8px var(--lesson-row, 1px); }
  .day { justify-items: center; padding: 1px 0 0; }
  .day span { width: 25px; height: 25px; }
  .event { margin: 0 7px 1px; border: 0; padding: 0; background: var(--kind-mark); }
  .event[data-span] { margin-inline: 0; }
  .event[data-continuation-start] { border-radius: 0 5px 5px 0; }
  .event[data-continuation-end] { border-radius: 5px 0 0 5px; }
  .event[data-continuation-start][data-continuation-end] { border-radius: 0; }
  .event-label { display: none; }
  .week:has(.more), .week:has(.lesson-count) { grid-template-rows: 29px repeat(3, 5px) 18px var(--lesson-row, 1px); }
  .scheduleControls { margin-inline-start: 0; }
  .lesson-count { justify-self: center; margin-inline: 1px; padding-inline: 2px; font-size: 10px; }
  .more { text-align: center; padding: 0; font-size: 10px; }
  .agenda { padding: 14px; }
  .agendaHead { margin: -14px -14px 14px; }
}

.repeatHint { color: var(--muted); font-size: 13px; margin: 0; }
.pickButton { min-height: 40px; height: auto; padding-block: 8px; }
.pickLabel { white-space: normal; overflow-wrap: anywhere; text-align: left; line-height: 1.4; min-width: 0; }

@media (max-width:700px) {
  .controls button {padding-inline:8px}
  .scheduleControls {gap:5px}
  .filters {gap:6px}
  .filterToggle {padding-inline:8px}
}

.lessonEntry[data-lesson] { color:var(--ink); border-inline-start:3px solid var(--lesson-mark); }
.lessonType { color:var(--lesson); font-weight:650; }

.toast {
  position:fixed;
  z-index:100;
  inset-inline-end:max(16px, env(safe-area-inset-right));
  inset-block-end:max(16px, env(safe-area-inset-bottom));
  width:max-content;
  max-width:calc(100vw - 32px);
  padding:10px 14px;
  border:1px solid var(--pine);
  border-radius:8px;
  background:var(--surface);
  color:var(--ink);
  box-shadow:0 4px 16px rgb(0 0 0 / .17);
  font-size:14px;
  overflow-wrap:anywhere;
  pointer-events:none;
}

@media (max-width: 780px) {
  .layout[data-week] .agendaEntry:not(.kind-step),
  .layout[data-week] .lessons,
  .layout[data-week] .agendaEmpty { display: none; }
}

@scope (.weekboard) {
.weekboard { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; overflow: clip; }
.dayStrip, .timeBand { display: grid; grid-template-columns: 76px repeat(7, minmax(0, 1fr)); }
.dayStrip { background: var(--panel-alt); }
.time { background: var(--paper); font-family: ui-monospace, monospace; }
.cell[data-current] { background: color-mix(in srgb, var(--selected) 5%, var(--surface)); }
.timeHead, .time { padding: 12px 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day { background: transparent; border: 0; border-inline-start: 1px solid var(--line); color: var(--ink); cursor: pointer; display: grid; padding: 8px; }
.day span { font-size: 12px; text-transform: uppercase; }
.day strong { font: 32px/1.15 var(--mantine-font-family-headings); }
.day[aria-pressed="true"] { color: #293020; background: #def09f; }
.day[aria-current="date"] strong { text-decoration: underline; text-underline-offset: 3px; }
.timeBand { border-block-start: 1px solid var(--line); min-height: 66px; }
.cell { min-width: 0; border-inline-start: 1px solid var(--line); padding: 5px; display: grid; align-content: start; gap: 4px; }
.block { border: 0; text-align: left; display: grid; min-width: 0; overflow-wrap: anywhere; border-inline-start: 3px solid var(--kind-mark); border-radius: 5px; padding: 6px 7px; background: var(--kind-bg); color: var(--kind-text); cursor: pointer; font: inherit; font-size: 13px; line-height: 1.3; }
.block span, .block small { font-size: 11px; margin-top: 3px; }
.block small { font-weight: 650; text-decoration: underline; }
.block[data-lesson] { border-color: var(--lesson); background: var(--lesson-bg); color: var(--lesson); }
.empty, .mobileEmpty { color: var(--muted); padding: 8px 16px; }
.mobileEmpty { display: none; }
@media (max-width: 780px) {
  .dayStrip { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .timeHead, .cell:not([data-current]), .timeBand[data-empty-day], .block.kind-step { display: none; }
  .timeBand { grid-template-columns: 70px minmax(0, 1fr); }
  .mobileEmpty { display: block; }
}

.block { color:var(--ink); }
.block[data-lesson] { border-color:var(--lesson-mark); color:var(--ink); }
.block .type { color:var(--lesson); font-weight:700; margin:0 0 3px; }

}
@scope (.plans) {
.heading, .sectionHeading, .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.heading { margin-bottom: 20px; flex-wrap: wrap; }
.heading h1 { margin: 0; letter-spacing: -.05em; font-size: clamp(32px, 4.5vw, 52px); line-height: 1.12; overflow-wrap: anywhere; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card, .detail { min-width: 0; background: var(--surface); border-color: var(--line); }
.card h2 { font-size: 25px; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.card h2 a { text-decoration: none; }
.card h2 a:hover { text-decoration: underline; }
.cover {
  height: clamp(110px, 11vw, 150px);
  margin-bottom: 20px;
  border-radius: 2px;
  background-color: #e8dded;
}
.cover[data-motif="film"] {
  background:
    repeating-linear-gradient(90deg, #483556 0 12px, transparent 12px 22px) top / 100% 10px no-repeat,
    repeating-linear-gradient(90deg, #483556 0 12px, transparent 12px 22px) bottom / 100% 10px no-repeat,
    linear-gradient(120deg, #c4a5cf, #efe4ae);
}
.cover[data-motif="route"] {
  background:
    radial-gradient(ellipse at 20% 105%, transparent 43%, #aec4df 43% 44%, transparent 44% 54%, #7d9fc1 54% 55%, transparent 55% 66%, #557da8 66% 67%, transparent 67%),
    #e4ecd0;
}
.cover[data-motif="grid"] {
  background:
    repeating-linear-gradient(0deg, transparent 0 14px, #a6875f55 14px 15px),
    repeating-linear-gradient(90deg, transparent 0 14px, #a6875f55 14px 15px),
    #f0e0c4;
}
.counter { color: var(--pine); font-weight: 600; margin: 12px 0 4px; }
.next { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.back { display: inline-block; margin-bottom: 12px; }
.detail { max-width: 760px; padding: 22px; }
.detail .heading { margin-bottom: 12px; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; }
.progress { display: grid; gap: 5px; color: var(--pine); margin-block: 16px; font-weight: 600; }
.progress progress { width: min(260px, 100%); height: 10px; accent-color: var(--pine); }
.section { margin-top: 24px; }
.sectionHeading { align-items:center; flex-wrap:wrap; gap:8px; padding-bottom:10px; border-bottom:1px solid var(--line); }
.sectionEmpty { margin:12px 0 0; color:var(--muted); }
.section h2 { margin: 0; font-size: 28px; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.row { padding-block: 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.row > * { min-width: 0; }
.row > button { flex: none; }
.stepDate { display: inline-block; margin: 4px 0 0 29px; color: var(--muted); font-size: 13px; }
.form { display: grid; gap: 12px; }
.save { justify-self: end; }
@media (max-width: 1000px) {
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .gallery { grid-template-columns: minmax(0, 1fr); }
  .detail { padding: 14px; }
  .row { gap: 8px; }
  .cover { height: 96px; }
}

.planGroup { margin-block: 20px 30px; }
.planGroup + .planGroup { border-top: 1px solid var(--line); padding-top: 16px; }
.planGroup > h2 { display: flex; gap: 9px; align-items: center; font-size: 26px; margin: 0 0 12px; }
.planGroup > h2::after { content: ''; height: 1px; background: var(--line); flex: 1; }
.planGroup > h2 span { font: 650 13px var(--mantine-font-family); color: var(--muted); }
.card { position: relative; border-radius: 4px; transition: border-color .15s; }
.card:hover, .card:focus-within { border-color: var(--pine); }
.card h3 { font-size: 29px; letter-spacing: -.035em; line-height: 1.18; margin: 0; overflow-wrap: anywhere; }
.cardLink { color: var(--ink); text-decoration: none; }
.cardLink::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.firstStep { position: relative; z-index: 1; align-self: flex-start; margin-top: 12px; }
.cardProgress { display: flex; gap: 10px; align-items: center; margin-block: 12px; font-size: 13px; color: var(--muted); }
.cardProgress progress { flex: 1; height: 6px; accent-color: var(--selected); }
.next { border-top: 1px solid var(--line); padding-top: 10px; }
.next span { color: var(--copper); font-size: 12px; font-weight: 700; margin-right: 4px; }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.cover[data-motif="dawn"] { background: radial-gradient(circle at 70% 86%, #ffd6ae 0 16%, transparent 17%), linear-gradient(152deg, #273766, #9a526a 65%, #d98269); }
.cover[data-motif="rings"] { background: repeating-radial-gradient(ellipse at 25% 10%, #2d4e7e 0 11%, #7898be 12% 15%, #becfe5 16% 21%); }
.cover[data-motif="reef"] { background: repeating-linear-gradient(119deg, #287b86 0 14px, #65b7ad 15px 28px, #cbe4d7 29px 30px); }
.cover[data-motif="atlas"] { background: repeating-linear-gradient(0deg, transparent 0 18px, #adc1df80 19px 20px), repeating-linear-gradient(90deg, transparent 0 18px, #adc1df80 19px 20px), linear-gradient(145deg, #29436a, #132640); }
.cover[data-motif="comet"] { background: radial-gradient(ellipse at 68% 40%, #f2cebe 0 4%, transparent 5%), linear-gradient(134deg, #1f3463 48%, #c47565 49% 52%, #667da9 53%); }
.cover[data-motif="field"] { background: radial-gradient(circle, #b7d0f1 1px, transparent 2px) 0 0 / 27px 27px, radial-gradient(ellipse at 60% 90%, #485985, #152544); }
.coverPreview .cover { height: 78px; margin: 0; }
.rowActions { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.stepContent { position: relative; padding-inline-start: 20px; }
.handle { position: absolute; inset: 0 auto auto 0; cursor: grab; color: var(--muted); }
.row[data-drop] { box-shadow: inset 0 2px var(--copper); }
@media (max-width: 650px) {
  .list .row { flex-wrap: wrap; }
  .list .rowActions { margin-inline-start: 20px; }
}

}

    .header .theme-toggle { padding:5px; }
    .plans .detail { display:flex; flex-direction:column; }
    button.brand { padding:0; font-weight:680; }
    .header nav button[aria-current="page"] { background:var(--panel-alt); }
    .views { display:flex; gap:2px; padding:3px; background:var(--panel-alt); border-radius:4px; }
    .views button { background:transparent; border:0; padding:5px 8px; color:var(--muted); }
    .views button[aria-pressed="true"] { background:var(--surface); color:var(--ink); }
    .scheduleControls label { display:flex; align-items:center; gap:8px; font-size:14px; }
    #show-lessons { appearance:none; cursor:pointer; width:38px; height:20px; border:1px solid var(--line); border-radius:12px; background:var(--panel-alt); margin:0; }
    #show-lessons::before { content:""; display:block; margin:2px; width:14px; height:14px; border-radius:50%; background:var(--muted); }
    #show-lessons:checked { background:var(--pine); }
    #show-lessons:checked::before { transform:translateX(17px); background:var(--surface); }
    .week .event { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agendaEntry small { color:var(--kind-text); }
    .lessonEntry button, .entry-actions button { font-size:13px; padding:4px 8px; }
    .entry-actions { align-items:start; flex-direction:column; }
    .lessonEntry { border-left:3px solid var(--lesson-mark); }
    .weekboard { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:4px; background:var(--surface); }
    .plans .card,.plans .detail { padding:22px; border:1px solid var(--line); background:var(--surface); }
    .plans .detail { border-radius:16px; }
    .plans .cardLink { display:block; font:inherit; text-align:left; padding:0; }
    .plans .rowActions button { padding:3px 8px; }
    .plans .heading .rowActions button { padding:8px 12px; }
    .stepContent label { font-size:14px; }
    .stepContent input { width:20px; height:20px; accent-color:var(--pine); vertical-align:middle; }
    button.stepDate { display:block; margin-left:29px; font-size:13px; }
    .day-layout { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr); gap:20px; align-items:start; }
    .overview { display:grid; gap:14px; }
    .tasks,.sheet { border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:18px; }
    .sheet h2,.tasks h2 { font:700 21px var(--mantine-font-family); display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; }
    .sheet h2 small,.tasks h2 small { font:14px monospace; color:var(--muted); }
    .hero { padding:26px; border-radius:10px; background:radial-gradient(circle at 105% -8%, transparent 92px,#31463b 93px 114px,transparent 115px),#172322; color:#f4f6f1; }
    [data-theme="dark"] .hero { background-color:#304f47; box-shadow:inset 0 0 0 1px #86a99c; }
    .hero small { color:#ffad80; text-transform:uppercase; letter-spacing:.09em; font:700 12px monospace; }
    .hero h2 { margin:24px 0; font:700 clamp(26px,3vw,42px)/1.09 var(--mantine-font-family); letter-spacing:-.045em; }
    .meta { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:14px; border-top:1px solid #769488; font-size:13px; }
    .meta b,.time-row b { display:block; font-size:19px; }
    .ribbon { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--line); background:var(--surface); padding:4px; gap:3px; border-radius:12px; margin:12px 0; }
    .ribbon button { display:grid; text-align:left; border:0; }
    .ribbon button[aria-pressed="true"] { background:var(--selected); color:var(--selected-ink); }
    .time-row { display:flex; align-items:stretch; gap:10px; margin:5px 0; }
    .time-row > div,.gap { color:var(--muted); font:13px/1.55 monospace; }
    .time-row button { text-align:left; flex:1; min-width:0; overflow-wrap:anywhere; border-left:3px solid var(--kind-mark,var(--pine)); background:var(--kind-bg,var(--lesson-bg)); color:var(--ink); }
    .gap { margin:8px 0; }
    .track { position:relative; border-left:1px solid var(--line); margin:6px 0 6px 45px; }
    .track button,.allDay button { background:var(--kind-bg,var(--lesson-bg)); border-left:3px solid var(--kind-mark,var(--lesson-mark)); }
    .track button { position:absolute; display:grid; align-content:center; text-align:left; padding:4px 8px; overflow:hidden; line-height:1.25; }
    .track button[data-next] { border:1px solid #ad562f; }
    [data-theme="dark"] .track button[data-next] { border-color:#ffac7d; }
    .track time,.tick { font:12px monospace; }
    .tick { position:absolute; left:-45px; color:var(--muted); }
    .tick[data-end] { transform:translateY(-100%); }
    .allDay { display:grid; gap:5px; margin-bottom:10px; }
    .allDay h3 { font:600 13px var(--mantine-font-family); margin:0; }
    @media(max-width:700px) {
      .track[data-dense] { display:grid; gap:5px; height:auto !important; margin-left:0; }
      .track[data-dense] button { position:static; width:100% !important; height:auto !important; min-height:50px; }
      .track[data-dense] .tick { display:none; }
    }
    @media(max-width:700px) {
      .plans .detail { padding:14px; }
      .views button,.controls button { padding-inline:6px; font-size:13px; }
      .day-layout { grid-template-columns:minmax(0,1fr); }
      .overview { display:contents; }
      .tasks { order:2; }
      .ribbon button { text-align:center; padding:6px 2px; }
      .ribbon small { display:none; }
      .hero { padding:17px; }
    }

  <header class="header">
    <div class="shell header-inner">
      <button class="brand" data-action="calendar"><span class="brand-mark" aria-hidden="true"></span>Орбита</button>

    </div>
  </header>
  <main id="app" class="shell content"></main>
  <aside class="review" aria-label="Проверка макета">
    <details class="shell"><summary>Состояния макета</summary><div class="review-buttons"><button data-action="month">Месяц</button
      ><button data-action="empty">Пустой день</button
      ><button data-action="pick">Выбор шага</button
      ><button data-action="filled">Заполненная форма</button
      ><button data-action="pending">Отправка</button
      ><button data-action="success">Успех</button
      ><button data-action="error">Ошибка</button
      ><button data-action="plan">Открытый план</button>
    </div></details>
  </aside>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <script>
    const app = document.querySelector("#app");
    const dialog = document.querySelector("#dialog");
    const months = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь",
    ];
    const travel = {
      kind: "event",
      title: "Поездка в Карелию",
      from: "2026-11-27",
      to: "2026-12-02",
      area: "personal",
    };
    const entries = [
      travel,
      {kind:"event", title:"Консультация по проекту", from:"2026-11-20", to:"2026-11-20", startTime:"10:00", endTime:"10:45", area:"study"},
      {
        kind: "deadline",
        title: "Лабораторная по алгоритмам", startTime:"18:00",
        from: "2026-11-20",
        to: "2026-11-20",
        area: "study",
      },
      {
        kind: "birthday",
        title: "День рождения Саши",
        from: "2026-11-24",
        to: "2026-11-24",
        area: "personal",
      },
    ];
    const labels = {
      event: "Событие",
      deadline: "Дедлайн",
      birthday: "День рождения",
      step: "Шаг плана",
    };
    const marks = { event: "◆", deadline: "⚑", birthday: "🎁", step: "✓" };
    const lessonWeekdays = [
      "Понедельник",
      "Вторник",
      "Среда",
      "Четверг",
      "Пятница",
      "Суббота",
      "Воскресенье",
    ];
    const lessons = [
      ["Дискретная математика", "2403", "09:00", "10:30","Лекция"],
      ["Проектирование интерфейсов", "2312", "10:50", "12:20","Практика"],
      ["Английский язык", "3104", "13:00", "14:30","Лабораторная"],
    ].map(([subject, room, startTime, endTime, type]) => ({
      type,
      weekday: 5,
      subject,
      room,
      startTime,
      endTime,
      termStart: "2026-09-01",
      termEnd: "2026-12-31",
    }));
    let showLessons = false;
    let view = "month";
    let filtersOpen = false;
    const today = "2026-11-20";
    const plans = [
      { title: "Снять первый короткий ролик", motif: "film", note: "Собрать ролик из коротких кадров и попробовать монтаж.",
        steps: [{title: "Посмотреть урок", done:true}, {title: "Собрать черновик"}, {title: "Посмотреть ролик целиком"}],
        resources: [{title:"Урок по монтажу", url:"https://www.blender.org/support/tutorials/"}] },
      { title:"Собрать список книг", motif:"grid", note:"", steps:[], resources:[] },
      { title:"Пройти маршрут вдоль залива", motif:"route", note:"", steps:[{title:"Пройти от набережной до маяка",done:true}], resources:[] },
    ];
    let currentPlan = plans[0];
    const fullDate = day => dateFrom(day).toLocaleDateString("ru", {weekday:"long", year:"numeric", month:"long", day:"numeric", timeZone:"UTC"}).replace(/ г\.$/,"");
    const countDone = plan => plan.steps.filter(step => step.done).length;
    const complete = plan => plan.steps.length > 0 && countDone(plan) === plan.steps.length;

    let selected = "2026-11-28",
      month = 10,
      year = 2026,
      section = "calendar",
      notice = "",
      area = "",
      kind = "";
    const iso = (date) => date.toISOString().slice(0, 10);
    const dateFrom = (value) => new Date(value + "T00:00:00Z");
    const formatDay = (value) =>
      dateFrom(value).toLocaleDateString("ru", {
        timeZone: "UTC",
        day: "numeric",
        month: "long",
      });
    const escapeHtml = (value) =>
      String(value).replace(
        /[&<>"']/g,
        (symbol) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[symbol],
      );
    const escape = escapeHtml;
    function visibleEntries() {
      const scheduled = plans.flatMap((plan, planIndex) => plan.steps.flatMap((step, index) =>
        step.date ? [{kind:"step", title:step.title, from:step.date, to:step.date, area:plan.area || "personal", done:step.done, planIndex, index}] : []));
      const all = entries.concat(scheduled);
      return all.filter(
        (item) =>
          (!area || item.area === area) && (!kind || item.kind === kind),
      );
    }
    const weekday = (day) => ((dateFrom(day).getUTCDay() + 6) % 7) + 1;
    const lessonsOn = (day) =>
      showLessons
        ? lessons
            .filter(
              (item) =>
                item.weekday === weekday(day) &&
                item.termStart <= day &&
                day <= item.termEnd && (item.repeat!=="biweekly" ||
                  (day>=item.firstDate && daysSince(day,item.firstDate)%14===0)),
            )
            .sort((a, b) => a.startTime.localeCompare(b.startTime))
        : [];
    const pluralLessons = new Intl.PluralRules("ru");
    const lessonCount = (count) => {
      const form = pluralLessons.select(count);
      return (
        count +
        " " +
        (form === "one" ? "пара" : form === "few" ? "пары" : "пар")
      );
    };

    function weekMarkup(days, items) {
      const spans = items.filter(
        (item) =>
          item.from !== item.to && item.from <= days[6] && item.to >= days[0],
      );
      const lanes = Array.from({ length: 7 }, () => [false, false, false]);
      function segment(item) {
        const first = item.from <= days[0] ? 0 : days.indexOf(item.from);
        const last = item.to >= days[6] ? 6 : days.indexOf(item.to);
        const lane = lanes[first].findIndex((_, index) =>
          lanes.slice(first, last + 1).every((day) => !day[index]),
        );
        if (lane < 0) return "";
        lanes.slice(first, last + 1).forEach((day) => (day[lane] = true));
        const caption =
          (item.from < days[0] ? "‹ " : "") +
          marks[item.kind] +
          " " +
          item.title +
          (item.to > days[6] ? " ›" : "");
        return (
          '<button class="event ' +
          item.kind + " kind-" + item.kind +
          '" style="grid-row:' +
          (lane + 2) +
          ";grid-column:" +
          (first + 1) +
          "/" +
          (last + 2) +
          '" data-entry="' +
          entries.indexOf(item) + '" data-plan-index="' + (item.planIndex ?? "") +
          '" data-day="' +
          days[first] +
          '" aria-label="' +
          escape(item.title) +
          '">' +
          '<span class="event-label">' + escape(caption) + "</span>" +
          "</button>"
        );
      }
      return (
        '<div class="week">' +
        days
          .map(
            (day, index) =>
              '<button class="day ' +
              (dateFrom(day).getUTCMonth() !== month ? "other" : "") +
              '" style="grid-column:' +
              (index + 1) +
              '" data-date="' +
              day +
              '" tabindex="' + (day===selected?"0":"-1") + '" aria-label="' +
              formatDay(day) +
              '" aria-pressed="' +
              (selected === day) +
              '"><span class="' +
              (selected === day ? "selected" : "") +
              (day === "2026-11-20" ? " today" : "") +
              '">' +
              dateFrom(day).getUTCDate() +
              "</span></button>",
          )
          .join("") +
        spans.map(segment).join("") +
        items
          .filter((item) => item.from === item.to && days.includes(item.from))
          .map(segment)
          .join("") +
        days
          .map((day, index) => {
            const count = lessonsOn(day).length;
            return count
              ? '<button class="lesson-count" style="grid-column:' +
                  (index + 1) +
                  '" data-date="' +
                  day +
                  '" aria-label="' +
                  lessonCount(count) +
                  " · " +
                  formatDay(day) +
                  '">' +
                  lessonCount(count) +
                  "</button>"
              : "";
          })
          .join("") +
        "</div>"
      );
    }
    function moveDay(day, offset) {
      const date = dateFrom(day);
      date.setUTCDate(date.getUTCDate() + offset);
      return iso(date);
    }
    function action(name, label, cls = "", attrs = "") {
      return `<button type="button" class="${cls}" data-action="${name}" ${attrs}>${label}</button>`;
    }
    function planCard(plan) {
      const i = plans.indexOf(plan);
      const next = plan.steps.find(step => !step.done);
      return `<article class="card"><div class="cover" data-motif="${plan.motif}"></div>
        <h3>${action("open-plan",escape(plan.title),"cardLink",`data-index="${i}"`)}</h3>
        ${plan.steps.length ? `<div class="cardProgress"><progress aria-label="Прогресс плана" value="${countDone(plan)}" max="${plan.steps.length}"></progress>${countDone(plan)} из ${plan.steps.length}</div>
        <p class="next">${next ? "<span>Далее</span> <strong>"+escape(next.title)+"</strong>" : "Все шаги выполнены"}</p>`
        : action("first-step","Добавить первый шаг","light firstStep",`data-index="${i}"`)}</article>`;
    }
    function planGroup(title, group) {
      return `<section class="planGroup"><h2>${title} <span>${group.length}</span></h2>
        <div class="gallery">${group.map(planCard).join("")}</div></section>`;
    }
    function stepRow(step, i) {
      const attrs = `data-index="${i}"`;
      return `<li class="row"><div class="stepContent"><span class="handle" draggable="true" data-index="${i}" aria-hidden="true">⠿</span>
        <label><input type="checkbox" data-done="${i}" ${step.done ? "checked" : ""}> ${escape(step.title)}</label>
        ${step.date ? `<button class="link stepDate" data-date="${step.date}">${fullDate(step.date)}</button>` : ""}</div>

    const minutes = time => Number(time.slice(0,2))*60 + Number(time.slice(3));

    const duration = n => n<=60 ? n+" мин" : Math.floor(n/60)+" ч"+(n%60 ? " "+n%60+" мин" : "");
    function timeline(timed, focus) {
      if (!timed.length) return "<p>Нет дел с указанным временем</p>";
      const groups = [];
      for (const item of timed) {
        const start = minutes(item.startTime), end = minutes(item.endTime || item.startTime);
        let group = groups.at(-1);
        if (!group || (start >= group.end && start !== group.start)) {
          group = {start,end,lanes:[],blocks:[]}; groups.push(group);
        }
        let lane = group.lanes.findIndex(until => until <= start);
        if (lane < 0) lane = group.lanes.length;
        group.lanes[lane] = Math.max(end,start+1);

        const {start,end,lanes,blocks} = group;
        const stops = [...new Set(blocks.flatMap(b=>[b.start,b.end]))].sort((a,b)=>a-b);
        const positions = new Map([[start,0]]);
        const clashes = [];
        let height = 0;
        for(let j=1;j<stops.length;j++){
          const from=stops[j-1], to=stops[j];
          height+=Math.max(24,Math.min(210,(to-from)*1.6));
          const overlapping=blocks.filter(b=>b.start<=from && b.end>=to);
          if(overlapping.length>1) clashes.push(`△ Пересечение ${clock(from)}–${clock(to)}`);
          for(const b of blocks.filter(b=>b.end===to && b.start<to))height=Math.max(height,positions.get(b.start)+56);
          positions.set(to,height);
        }
        const ticks=stops.map(t=>`<time class="tick" ${t===end && end>start?"data-end":""} style="top:${positions.get(t)}px">${clock(t)}</time>`).join("");
        const controls=blocks.map(({item,start:a,end:b,lane})=>`<button class="kind-${item.kind}" ${recordAttrs(item)} ${item===focus?"data-next":""} style="top:${positions.get(a)}px;left:${lane*100/lanes.length}%;width:calc(${100/lanes.length}% - 3px);height:${Math.max(56,positions.get(b)-positions.get(a))}px"><small>${recordLabel(item)}${item===focus?(selected===today && a<=552?" · Сейчас":" · Далее"):""}</small><b>${escape(item.title)}</b><time>${timeRange(item)}${item.room?" · Ауд. "+escape(item.room):""}</time></button>`).join("");
        height=Math.max(...blocks.map(b=>positions.get(b.start)+Math.max(56,positions.get(b.end)-positions.get(b.start))));

        <div class="dates"><label>Начало пары<input name="startTime" type="time" required value="${r.startTime||""}"></label>
        <label>Конец пары<input name="endTime" type="time" required value="${r.endTime||""}"></label></div>
        <label>Повторение пары<select name="repeat">${options([["weekly","Каждую неделю"],["biweekly","Раз в две недели"],["once","Однократно"]],r.repeat||"weekly")}</select></label>
        <div class="dates" data-recurrent><label>Начало семестра<input name="termStart" type="date" required value="${r.termStart}"></label><label>Конец семестра<input name="termEnd" type="date" required value="${r.termEnd}"></label></div>
        <label data-once>Дата пары<input name="singleDate" type="date" required value="${r.termStart}"></label>
        <label data-biweekly>Дата первой пары<input name="firstDate" type="date" value="${r.firstDate||""}"></label>
        <button class="primary">Сохранить</button></form>`);
      lessonRepeatFields();
    }
    function lessonRepeatFields() {
      const form = document.querySelector("#lesson-form");
      const repeat = form.elements.repeat.value;
      for (const [attr,visible] of [["recurrent",repeat!=="once"],["once",repeat==="once"],["biweekly",repeat==="biweekly"]]) {
        for(const section of form.querySelectorAll("[data-"+attr+"]")){
          section.hidden=!visible;
          section.querySelectorAll("input,select").forEach(input=>input.disabled=!visible);
        }
      }
    }

    app.addEventListener("keydown",event=>{
      const day=event.target.closest(".calendar .day");
      if(!day)return;
      const offset={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[event.key];
      if(offset===undefined)return;
      event.preventDefault();
      const next=moveDay(day.dataset.date,offset);
      let target=app.querySelector('.day[data-date="'+next+'"]');
      if(!target){selectDay(next);target=app.querySelector('.day[data-date="'+next+'"]');}
      target?.focus();
    });
    document.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.date) {
        selectDay(button.dataset.date);
        app.querySelector('.day[data-date="'+selected+'"]')?.focus();
        return;
      }
      if (button.dataset.lessonIndex !== undefined) {
        showLessonForm(lessons[Number(button.dataset.lessonIndex)]);
        return;
      }
      if (button.dataset.entry !== undefined) {
        if (button.dataset.day) selectDay(button.dataset.day);
        const item = entries[Number(button.dataset.entry)];
        if (item) showForm("edit", item);
        else {
          currentPlan = plans[Number(button.dataset.planIndex)] || plans[0];
          section = "plan";
          render();
        }
        return;
      }
      switch (button.dataset.action) {
        case "today":
          selectDay("2026-11-20");
          break;
        case "month":
          view = "month";
          selectDay("2026-11-28");
          break;
        case "empty":
          view = "month";
          selectDay("2026-11-21");
          break;
        case "prev":
          selectDay(
            view !== "month"
              ? moveDay(selected, view==="day"?-1:-7)
              : iso(new Date(Date.UTC(year, month - 1, 1))),
          );
          break;
        case "next":
          selectDay(
            view !== "month"
              ? moveDay(selected, view==="day"?1:7)
              : iso(new Date(Date.UTC(year, month + 1, 1))),
          );
          break;
        case "filters": filtersOpen=!filtersOpen; render(); break;
        case "view-day":
        case "view-month":
        case "view-week":
          view = button.dataset.action.slice(5);
          render();
          break;
        case "theme": {
          const dark = document.documentElement.dataset.theme !== "dark";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          remember();
          button.textContent = dark ? "☀" : "☾";
          button.setAttribute(
            "aria-label",
            dark ? "Светлая тема" : "Тёмная тема",
          );
          break;
        }
        case "calendar":
        case "plans":
        case "plan":
          if (button.dataset.action==="plan") {
            currentPlan=plans.find(p=>p.motif==="film") || plans[0];
            if(!currentPlan){section="plans"; render(); break;}
          }
          section = button.dataset.action;
          render();
          break;
        case "clear-date": dialog.querySelector("[name=date]").value=""; break;
        case "reset":
          area = "";
          kind = "";
          render();
          break;
        case "pick":
          section = "calendar";
          render();
          openDialog(
            "Выбрать шаг из планов",
            plans.some(plan=>plan.steps.some(step=>!step.done&&!step.date))
              ? '<p class="muted">'+fullDate(selected)+'</p>'+plans.map((plan,p)=>{
                  const choices=plan.steps.map((step,i)=>!step.date&&!step.done ? action("assign",escape(step.title),"light",`data-plan="${p}" data-index="${i}"`) : "").filter(Boolean);
                  return choices.length ? '<div class="pick-group"><small>'+escape(plan.title)+'</small>'+choices.join("")+'</div>' : "";
                }).join("")
              : '<p>Нет незавершённых шагов без даты.</p>'+action("open-plans","К планам"),
          );
          break;
        case "open-plans":
          dialog.close(); section="plans"; render(); break;
        case "assign": {
          const step=plans[Number(button.dataset.plan)].steps[Number(button.dataset.index)];
          step.date=selected; area=""; kind=""; dialog.close();
          notify("Шаг «"+step.title+"» назначен на "+formatDay(selected)+"."); break;
        }
        case "done":
          plans[Number(button.dataset.plan)].steps[Number(button.dataset.index)].done=true;
          notify("Шаг выполнен."); break;
        case "open-plan": case "first-step":
          currentPlan=plans[Number(button.dataset.index)]; section="plan"; render();
          if(button.dataset.action==="first-step") editPlanPart("new-step");
          break;
        case "new-plan": case "edit-plan": case "new-step": case "edit-step": case "new-resource":
          editPlanPart(button.dataset.action,Number(button.dataset.index)); break;
        case "up": case "down": {
          const i=Number(button.dataset.index);
          moveStep(i,i+(button.dataset.action==="up"?-1:1)); break;
        }
        case "remove-resource":
          currentPlan.resources.splice(Number(button.dataset.index),1); render(); break;
        case "remove-plan": case "remove-step":
          openDialog(button.dataset.action==="remove-plan"?"Удалить план?":"Удалить шаг?",action("close","Отмена")+action("confirm-remove","Подтвердить удаление","danger",`data-index="${button.dataset.index??""}"`)); break;
        case "confirm-remove":
          if(button.dataset.index===""){plans.splice(plans.indexOf(currentPlan),1);currentPlan=plans[0];section="plans";}
          else currentPlan.steps.splice(Number(button.dataset.index),1);
          dialog.close();render();break;
        case "add-lesson":
          showLessonForm();
          break;
        case "add":
        case "filled":
        case "pending":
        case "error":
          showForm(button.dataset.action);
          break;
        case "success":
          selectDay("2026-11-28");
          notice = "Запись сохранена";
          render();
          break;
        case "close":
          dialog.close();
          break;
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.name==="repeat" && event.target.closest("#lesson-form")) lessonRepeatFields();
      if (event.target.id === "show-lessons") {
        showLessons = event.target.checked;
        render();
        document.querySelector("#show-lessons").focus();
      }
      if (event.target.dataset.done !== undefined) {
        currentPlan.steps[Number(event.target.dataset.done)].done = event.target.checked;
        render();
      }
      if (event.target.id === "area") {
        area = event.target.value;
        render();
      }
      if (event.target.id === "kind") {
        kind = event.target.value;
        render();
      }
    });
    document.addEventListener("submit", (event) => {
      if (event.target.id === "plan-form") {
        event.preventDefault();
        const f=event.target, fields=Object.fromEntries(new FormData(f)), mode=f.dataset.mode;
        fields.title=fields.title.trim();
        if(!fields.title){f.elements.title.focus();return;}
        if(mode==="new-plan"){
          currentPlan={...fields,steps:[],resources:[]}; plans.push(currentPlan); section="plan";
        } else if(mode==="edit-plan")Object.assign(currentPlan,fields);
        else if(mode==="new-resource")currentPlan.resources.push(fields);
        else if(mode==="new-step")currentPlan.steps.push(fields);
        else Object.assign(currentPlan.steps[Number(f.dataset.index)],fields);
        dialog.close(); render(); return;
      }
      if (event.target.id === "lesson-form") {
        event.preventDefault();
        const form = event.target;
        const fields = Object.fromEntries(new FormData(form));
        if(fields.repeat==="once"){
          fields.termStart=fields.termEnd=fields.singleDate;
          fields.weekday=weekday(fields.singleDate);
        }else fields.weekday=Number(fields.weekday);
        const first = dateFrom(fields.termStart);
        first.setUTCDate(
          first.getUTCDate() +
            ((fields.weekday - weekday(fields.termStart) + 7) % 7),
        );
        const invalid =
          fields.endTime <= fields.startTime
            ? form.elements.endTime
            : iso(first) > fields.termEnd
              ? form.elements.termEnd
              : null;
        if (invalid) {
          invalid.setCustomValidity(
            invalid.name === "endTime"
              ? "Конец пары должен быть позже начала"
              : "Нет занятий в указанном периоде",
          );
          invalid.reportValidity();
          invalid.oninput = () => invalid.setCustomValidity("");
          return;
        }
        if(fields.repeat==="biweekly"){
          fields.firstDate ||= iso(first);
          if(fields.firstDate<fields.termStart || fields.firstDate>fields.termEnd || weekday(fields.firstDate)!==fields.weekday){
            form.elements.firstDate.setCustomValidity("Выберите дату занятия в пределах семестра.");
            form.elements.firstDate.reportValidity(); form.elements.firstDate.oninput=()=>form.elements.firstDate.setCustomValidity(""); return;
          }
        }
        const index = Number(form.dataset.index);
        if (index >= 0) Object.assign(lessons[index], fields);
        else lessons.push(fields);
        dialog.close();
        if (!lessonsOn(selected).includes(index >= 0 ? lessons[index] : fields))
          selectDay(fields.firstDate||iso(first));
        notify("Пара сохранена.");
        return;
      }
      if (event.target.id !== "entry-form") return;
      event.preventDefault();
      const form = event.target,
        item = Object.fromEntries(new FormData(form));
      if (item.to < item.from) {
        form.elements.to.setCustomValidity("Окончание раньше начала");
        form.elements.to.reportValidity();
        form.elements.to.oninput = () => form.elements.to.setCustomValidity("");
        return;
      }
      const submit = form.querySelector("button");
      submit.disabled = true;
      submit.textContent = "Сохраняем…";
      setTimeout(() => {
        if (!dialog.open || !form.isConnected) return;
        const index = Number(form.dataset.index);
        if (index >= 0) Object.assign(entries[index], item);
        else entries.push(item);
        dialog.close();
        selectDay(item.from);
        notify("Запись сохранена.");
      }, 450);
    });
    // Demo data belongs to this browser tab. Reloading restores the scenario.
    const storageKey = "orbit-calendar-plans-demo-v1";
    function remember() {
      try {
        sessionStorage.setItem(storageKey,JSON.stringify({plans,entries,lessons,selected,section,view,
          planIndex:plans.indexOf(currentPlan), theme:document.documentElement.dataset.theme}));
      } catch { /* Some browsers disable storage for local files. */ }
    }
    try {
      const saved=JSON.parse(sessionStorage.getItem(storageKey));
      if(saved){
        plans.splice(0,plans.length,...saved.plans);
        entries.splice(0,entries.length,...saved.entries);
        lessons.splice(0,lessons.length,...saved.lessons);
        selected=saved.selected; month=dateFrom(selected).getUTCMonth(); year=dateFrom(selected).getUTCFullYear();
        currentPlan=plans[saved.planIndex] || plans[0]; section=saved.section; view=saved.view;
        if(saved.theme==="dark"){
          document.documentElement.dataset.theme="dark";
          const themeButton=document.querySelector(".theme-toggle");
          themeButton.textContent="☀"; themeButton.setAttribute("aria-label","Светлая тема");
        }
      }
    } catch { /* Start with the built-in calendar when storage is unavailable. */ }
    render();
  </script>
</html>
